<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RDP.SALE</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 250px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            overflow-y: auto;
            z-index: 40;
        }

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
            background-color: #f8fafc;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #06b6d4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            min-width: 300px;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            min-width: 100%;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
            }
        }

        .stat-card {
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Configuration
        const API_URL = 'https://script.google.com/macros/s/AKfycbzSsUWM2Z8ikITvp6z089EvyN0tDUbXMdjmosrHEKZ8MFF0cnnrTLz17ApGxDDkWynr/exec';

        // Note: Admin credentials are now stored securely in the backend
        // No more hardcoded passwords in frontend!

        // Toast Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';

            return (
                <div className={`toast ${bgColor} text-white`}>
                    <div className="flex items-center justify-between">
                        <span className="font-medium">{message}</span>
                        <button onClick={onClose} className="ml-4 text-white hover:text-gray-200">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            );
        };

        // Loading Spinner Component
        const LoadingSpinner = () => (
            <div className="flex justify-center items-center p-8">
                <div className="spinner"></div>
            </div>
        );

        // Sidebar Component
        const Sidebar = ({ currentPage, onNavigate, onLogout, pendingCount }) => {
            const [mobileOpen, setMobileOpen] = useState(false);

            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6' },
                { id: 'orders', label: 'Orders', icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z', badge: pendingCount },
                { id: 'customers', label: 'Customers', icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z' },
                { id: 'servers', label: 'Servers', icon: 'M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01' },
                { id: 'actions', label: 'Action Requests', icon: 'M13 10V3L4 14h7v7l9-11h-7z' },
                { id: 'sheets', label: 'Google Sheets', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' }
            ];

            return (
                <>
                    {/* Mobile Menu Button */}
                    <button
                        onClick={() => setMobileOpen(!mobileOpen)}
                        className="md:hidden fixed top-4 left-4 z-50 bg-gray-800 text-white p-2 rounded-lg"
                    >
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <div className={`sidebar ${mobileOpen ? 'open' : ''}`}>
                        <div className="p-6">
                            <div className="flex items-center space-x-2 mb-8">
                                <svg className="w-8 h-8 text-cyan-400" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M5.5 16a3.5 3.5 0 01-.369-6.98 4 4 0 117.753-1.977A4.5 4.5 0 1113.5 16h-8z" />
                                </svg>
                                <span className="text-2xl font-bold text-white">RDP.SALE</span>
                            </div>

                            <nav className="space-y-2">
                                {menuItems.map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => {
                                            onNavigate(item.id);
                                            setMobileOpen(false);
                                        }}
                                        className={`w-full flex items-center justify-between px-4 py-3 rounded-lg transition ${
                                            currentPage === item.id
                                                ? 'bg-cyan-600 text-white'
                                                : 'text-gray-300 hover:bg-gray-700 hover:text-white'
                                        }`}
                                    >
                                        <div className="flex items-center space-x-3">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon} />
                                            </svg>
                                            <span className="font-medium">{item.label}</span>
                                        </div>
                                        {item.badge > 0 && (
                                            <span className="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full">
                                                {item.badge}
                                            </span>
                                        )}
                                    </button>
                                ))}
                            </nav>

                            <button
                                onClick={onLogout}
                                className="w-full mt-8 flex items-center space-x-3 px-4 py-3 text-red-400 hover:bg-red-900/20 rounded-lg transition"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                </svg>
                                <span className="font-medium">Logout</span>
                            </button>
                        </div>
                    </div>
                </>
            );
        };

        // Login Page Component
        const LoginPage = ({ onLogin, showToast }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async () => {
                if (!email || !password) {
                    showToast('Please enter email and password', 'error');
                    return;
                }

                setLoading(true);

                try {
                    // Call backend adminLogin endpoint
                    const params = new URLSearchParams();
                    params.append('email', email);
                    params.append('password', password);

                    const response = await fetch(`${API_URL}?action=adminLogin`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: params.toString()
                    });

                    const data = await response.json();

                    if (data.success) {
                        showToast('Login successful!', 'success');
                        onLogin(data.admin);
                    } else {
                        showToast(data.message || 'Invalid credentials', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                    console.error('Admin login error:', error);
                }

                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-cyan-50 to-blue-100 p-4">
                    <div className="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
                        <div className="flex items-center justify-center space-x-2 mb-8">
                            <svg className="w-10 h-10 text-cyan-500" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M5.5 16a3.5 3.5 0 01-.369-6.98 4 4 0 117.753-1.977A4.5 4.5 0 1113.5 16h-8z" />
                            </svg>
                            <span className="text-3xl font-bold text-cyan-600">RDP.SALE</span>
                        </div>

                        <h2 className="text-2xl font-bold text-gray-800 mb-6 text-center">Admin Login</h2>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                    placeholder="admin@rdp.sale"
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSubmit()}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                    placeholder="Enter password"
                                />
                            </div>

                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full bg-cyan-600 hover:bg-cyan-700 text-white py-3 rounded-lg font-semibold transition disabled:opacity-50"
                            >
                                {loading ? 'Logging in...' : 'Login'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Dashboard Page Component
        const DashboardPage = ({ data }) => {
            const stats = [
                { label: 'Total Users', value: data.users?.length || 0, icon: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z', color: 'bg-blue-500' },
                { label: 'Total Orders', value: data.orders?.length || 0, icon: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z', color: 'bg-green-500' },
                { label: 'Pending Orders', value: data.orders?.filter(o => o.status === 'pending').length || 0, icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z', color: 'bg-yellow-500' },
                { label: 'Active Servers', value: data.orders?.filter(o => o.status === 'active').length || 0, icon: 'M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01', color: 'bg-cyan-500' },
                { label: 'Total Revenue', value: `Rs ${(data.orders?.reduce((sum, o) => sum + o.price, 0) || 0).toLocaleString()}`, icon: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z', color: 'bg-purple-500' },
                { label: 'Action Requests', value: data.actions?.filter(a => a.status === 'pending').length || 0, icon: 'M13 10V3L4 14h7v7l9-11h-7z', color: 'bg-red-500' }
            ];

            const recentOrders = data.orders?.slice(0, 10) || [];

            return (
                <div className="p-6">
                    <h1 className="text-3xl font-bold text-gray-800 mb-8">Dashboard</h1>

                    {/* Statistics Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                        {stats.map((stat, index) => (
                            <div key={index} className="bg-white rounded-xl shadow-lg p-6 stat-card">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <p className="text-gray-600 text-sm font-medium mb-1">{stat.label}</p>
                                        <p className="text-3xl font-bold text-gray-800">{stat.value}</p>
                                    </div>
                                    <div className={`${stat.color} p-4 rounded-full`}>
                                        <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={stat.icon} />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Recent Orders */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <h2 className="text-xl font-bold text-gray-800 mb-4">Recent Orders</h2>
                        {recentOrders.length === 0 ? (
                            <p className="text-gray-500 text-center py-8">No orders yet</p>
                        ) : (
                            <div className="table-container">
                                <table className="w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Order ID</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Customer</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Plan</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Price</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {recentOrders.map((order, index) => (
                                            <tr key={index} className="hover:bg-gray-50">
                                                <td className="px-4 py-3 text-sm text-gray-800 font-mono">{order.orderId}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">{order.userEmail}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">{order.planName}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">Rs {order.price.toLocaleString()}</td>
                                                <td className="px-4 py-3 text-sm">
                                                    <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                                                        order.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                                        order.status === 'processing' ? 'bg-blue-100 text-blue-800' :
                                                        order.status === 'active' ? 'bg-green-100 text-green-800' :
                                                        'bg-red-100 text-red-800'
                                                    }`}>
                                                        {order.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Orders Page Component
        const OrdersPage = ({ data, onRefresh, showToast }) => {
            const [orders, setOrders] = useState(data.orders || []);
            const [searchTerm, setSearchTerm] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [selectedOrder, setSelectedOrder] = useState(null);

            useEffect(() => {
                setOrders(data.orders || []);
            }, [data.orders]);

            const filteredOrders = orders.filter(order => {
                const matchesSearch = searchTerm === '' ||
                    order.orderId.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    order.userEmail.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    order.planName.toLowerCase().includes(searchTerm.toLowerCase());

                const matchesFilter = filterStatus === 'all' || order.status === filterStatus;

                return matchesSearch && matchesFilter;
            });

            const handleStatusUpdate = async (orderId, newStatus) => {
                try {
                    console.log('Updating order:', orderId, 'to status:', newStatus);

                    const params = new URLSearchParams();
                    params.append('orderId', orderId);
                    params.append('status', newStatus);

                    console.log('Request params:', params.toString());

                    const response = await fetch(`${API_URL}?action=updateOrderStatus`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString()
                    });

                    const result = await response.json();
                    console.log('Response:', result);

                    if (result.success) {
                        showToast('Order status updated successfully', 'success');
                        onRefresh();
                    } else {
                        showToast(result.message || 'Failed to update status', 'error');
                        console.error('Update failed:', result.message);
                    }
                } catch (error) {
                    showToast('Network error', 'error');
                    console.error('Status update error:', error);
                }
            };

            return (
                <div className="p-6">
                    <h1 className="text-3xl font-bold text-gray-800 mb-8">Orders Management</h1>

                    {/* Filters */}
                    <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Search</label>
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder="Search by Order ID, Email, or Plan"
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Filter by Status</label>
                                <select
                                    value={filterStatus}
                                    onChange={(e) => setFilterStatus(e.target.value)}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                >
                                    <option value="all">All Status</option>
                                    <option value="pending">Pending</option>
                                    <option value="processing">Processing</option>
                                    <option value="active">Active</option>
                                    <option value="suspended">Suspended</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    {/* Orders Table */}
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        {filteredOrders.length === 0 ? (
                            <p className="text-gray-500 text-center py-8">No orders found</p>
                        ) : (
                            <div className="table-container">
                                <table className="w-full">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Order ID</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Customer</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Plan</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Price</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Status</th>
                                            <th className="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {filteredOrders.map((order, index) => (
                                            <tr key={index} className="hover:bg-gray-50">
                                                <td className="px-4 py-3 text-sm text-gray-800 font-mono">{order.orderId}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">{order.userEmail}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">{order.planName}</td>
                                                <td className="px-4 py-3 text-sm text-gray-800">Rs {order.price.toLocaleString()}</td>
                                                <td className="px-4 py-3">
                                                    <select
                                                        value={order.status}
                                                        onChange={(e) => handleStatusUpdate(order.orderId, e.target.value)}
                                                        className={`px-3 py-1 rounded-full text-xs font-semibold border-0 ${
                                                            order.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                                            order.status === 'processing' ? 'bg-blue-100 text-blue-800' :
                                                            order.status === 'active' ? 'bg-green-100 text-green-800' :
                                                            'bg-red-100 text-red-800'
                                                        }`}
                                                    >
                                                        <option value="pending">Pending</option>
                                                        <option value="processing">Processing</option>
                                                        <option value="active">Active</option>
                                                        <option value="suspended">Suspended</option>
                                                    </select>
                                                </td>
                                                <td className="px-4 py-3">
                                                    <button
                                                        onClick={() => setSelectedOrder(order)}
                                                        className="text-cyan-600 hover:text-cyan-800 font-medium text-sm"
                                                    >
                                                        View Details
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* Order Details Modal */}
                    {selectedOrder && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay" onClick={() => setSelectedOrder(null)}>
                            <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-2xl font-bold text-gray-800">Order Details</h2>

        // Main App Component
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [data, setData] = useState({ users: [], orders: [], servers: [], actions: [] });
            const [loading, setLoading] = useState(false);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                // Check if admin is logged in
                const adminSession = localStorage.getItem('admin_session');
                if (adminSession) {
                    setIsLoggedIn(true);
                    loadData();
                }
            }, []);

            useEffect(() => {
                if (isLoggedIn) {
                    const interval = setInterval(loadData, 30000); // Refresh every 30 seconds
                    return () => clearInterval(interval);
                }
            }, [isLoggedIn]);

            const loadData = async () => {
                setLoading(true);
                try {
                    const [usersRes, ordersRes, serversRes, actionsRes] = await Promise.all([
                        fetch(`${API_URL}?action=getAllUsers`),
                        fetch(`${API_URL}?action=getAllOrders`),
                        fetch(`${API_URL}?action=getAllServers`),
                        fetch(`${API_URL}?action=getAllActionRequests`)
                    ]);

                    const [usersData, ordersData, serversData, actionsData] = await Promise.all([
                        usersRes.json(),
                        ordersRes.json(),
                        serversRes.json(),
                        actionsRes.json()
                    ]);

                    setData({
                        users: usersData.success ? usersData.users : [],
                        orders: ordersData.success ? ordersData.orders : [],
                        servers: serversData.success ? serversData.servers : [],
                        actions: actionsData.success ? actionsData.actions : []
                    });
                } catch (error) {
                    console.error('Load data error:', error);
                }
                setLoading(false);
            };

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const handleLogin = (adminData) => {
                setIsLoggedIn(true);
                localStorage.setItem('admin_session', JSON.stringify(adminData));
                loadData();
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                localStorage.removeItem('admin_session');
                showToast('Logged out successfully', 'success');
            };

            const pendingCount = data.orders.filter(o => o.status === 'pending').length;

            if (!isLoggedIn) {
                return (
                    <>
                        <LoginPage onLogin={handleLogin} showToast={showToast} />
                        {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    </>
                );
            }

            return (
                <>
                    <Sidebar
                        currentPage={currentPage}
                        onNavigate={setCurrentPage}
                        onLogout={handleLogout}
                        pendingCount={pendingCount}
                    />
                    <div className="main-content">
                        {loading && currentPage !== 'sheets' && <LoadingSpinner />}
                        {!loading && (
                            <>
                                {currentPage === 'dashboard' && <DashboardPage data={data} />}
                                {currentPage === 'orders' && <OrdersPage data={data} onRefresh={loadData} showToast={showToast} />}
                                {currentPage === 'customers' && <CustomersPage data={data} />}
                                {currentPage === 'servers' && <ServersPage data={data} onRefresh={loadData} showToast={showToast} />}
                                {currentPage === 'actions' && <ActionRequestsPage data={data} onRefresh={loadData} showToast={showToast} />}
                                {currentPage === 'sheets' && <GoogleSheetsPage />}
                            </>
                        )}
                    </div>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
