<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your shopping cart - Review your items and proceed to checkout">
  <title>Shopping Cart - E-Commerce Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">ShopNow</a>

      <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li>
          <a href="cart.html" class="nav-link" style="position: relative;">
            Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </li>
        <li id="login-link"><a href="login.html" class="nav-link">Login</a></li>
        <li id="dashboard-link" style="display: none;"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li id="logout-link" style="display: none;"><a href="#" class="nav-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Shopping Cart</h1>
      <p class="page-subtitle">Review your items and proceed to checkout</p>
    </div>

    <div class="cart-container">
      <!-- Cart Items -->
      <div class="cart-items">
        <div id="cart-items">
          <!-- Cart items will be loaded here -->
        </div>
      </div>

      <!-- Cart Summary -->
      <div id="cart-summary">
        <!-- Summary will be loaded here -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script>
    // Render cart when page loads
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
    });
  </script>
</body>
</html>
