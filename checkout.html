<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your order with Cash on Delivery">
  <title>Checkout - E-Commerce Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">ShopNow</a>

      <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li>
          <a href="cart.html" class="nav-link" style="position: relative;">
            Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </li>
        <li id="login-link"><a href="login.html" class="nav-link">Login</a></li>
        <li id="dashboard-link" style="display: none;"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li id="logout-link" style="display: none;"><a href="#" class="nav-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container" id="checkout-container">
    <div class="page-header">
      <h1 class="page-title">Checkout</h1>
      <p class="page-subtitle">Complete your order - Cash on Delivery</p>
    </div>

    <div id="error-message"></div>

    <div class="cart-container">
      <!-- Checkout Form -->
      <div class="cart-items">
        <form id="checkout-form" onsubmit="handleCheckout(event)">
          <h2 class="mb-3">Delivery Information</h2>

          <div class="form-group">
            <label class="form-label" for="full_name">Full Name *</label>
            <input
              type="text"
              id="full_name"
              name="full_name"
              class="form-input"
              required
              placeholder="Enter your full name"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number *</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-input"
              required
              placeholder="Enter your phone number"
              pattern="[0-9]{10}"
              title="Please enter a valid 10-digit phone number"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="city">City *</label>
            <input
              type="text"
              id="city"
              name="city"
              class="form-input"
              required
              placeholder="Enter your city"
            >
          </div>

          <div class="form-group">
            <label class="form-label" for="address">Full Address *</label>
            <textarea
              id="address"
              name="address"
              class="form-textarea"
              required
              placeholder="Enter your complete delivery address"
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Payment Method</label>
            <div class="alert alert-info">
              <strong>Cash on Delivery (COD)</strong><br>
              Pay when you receive your order
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">
            Place Order
          </button>

          <a href="cart.html" class="btn btn-outline btn-block mt-2">
            Back to Cart
          </a>
        </form>
      </div>

      <!-- Order Summary -->
      <div class="cart-summary">
        <div id="checkout-items">
          <!-- Order summary will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script>
    // Initialize checkout page
    document.addEventListener('DOMContentLoaded', () => {
      initCheckout();
    });
  </script>
</body>
</html>
