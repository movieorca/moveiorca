<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDP.SALE - Premium RDP Services</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #ecfeff 0%, #dbeafe 100%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #06b6d4;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            min-width: 300px;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 9999;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .popular-badge {
            position: absolute;
            top: -12px;
            right: 20px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Configuration
        const API_URL = 'https://script.google.com/macros/s/AKfycbx84TC0-sI-nLrl19glwTiAxa4sIxGyKs8tPxnOy1pOARXYnFzYunzEp-f4TDb_WP7B/exec';

        // RDP Plans Data
        const PLANS = [
            {
                id: 1,
                name: 'Mini',
                price: 1999,
                cpu: '4 vCPU',
                ram: '6GB RAM',
                storage: '120GB SSD',
                traffic: '3TB Traffic/Month'
            },
            {
                id: 2,
                name: 'Basic',
                price: 2799,
                cpu: '4 vCPU',
                ram: '10GB RAM',
                storage: '100GB NVMe / 200GB SSD',
                traffic: '32TB Traffic',
                popular: true
            },
            {
                id: 3,
                name: 'Plus',
                price: 3799,
                cpu: '6 vCPU',
                ram: '18GB RAM',
                storage: '150GB NVMe / 300GB SSD',
                traffic: '32TB Traffic'
            },
            {
                id: 4,
                name: 'Pro',
                price: 7499,
                cpu: '8 vCPU',
                ram: '36GB RAM',
                storage: '250GB NVMe / 500GB SSD',
                traffic: '32TB Traffic'
            },
            {
                id: 5,
                name: 'Ultra',
                price: 10999,
                cpu: '12 vCPU',
                ram: '48GB RAM',
                storage: '250GB NVMe / 500GB SSD',
                traffic: '32TB Traffic'
            },
            {
                id: 6,
                name: 'Max',
                price: 17999,
                cpu: '16 vCPU',
                ram: '64GB RAM',
                storage: '300GB NVMe / 600GB SSD',
                traffic: '32TB Traffic'
            },
            {
                id: 7,
                name: 'Extreme',
                price: 23699,
                cpu: '18 vCPU',
                ram: '96GB RAM',
                storage: '350GB NVMe / 700GB SSD',
                traffic: '32TB Traffic'
            }
        ];

        // Payment Details
        const PAYMENT_INFO = {
            accountNumber: '03316873505',
            accountHolder: 'Shaista Nawaz'
        };

        // Toast Component
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';

            return (
                <div className={`toast ${bgColor} text-white`}>
                    <div className="flex items-center justify-between">
                        <span className="font-medium">{message}</span>
                        <button onClick={onClose} className="ml-4 text-white hover:text-gray-200">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
            );
        };

        // Loading Spinner Component
        const LoadingSpinner = () => (
            <div className="flex justify-center items-center p-8">
                <div className="spinner"></div>
            </div>
        );

        // Header Component
        const Header = ({ user, cartCount, onNavigate, onLogout }) => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            return (
                <header className="bg-white shadow-md sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center py-4">
                            {/* Logo */}
                            <div
                                className="flex items-center space-x-2 cursor-pointer"
                                onClick={() => onNavigate('plans')}
                            >
                                <svg className="w-8 h-8 text-cyan-500" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M5.5 16a3.5 3.5 0 01-.369-6.98 4 4 0 117.753-1.977A4.5 4.5 0 1113.5 16h-8z" />
                                </svg>
                                <span className="text-2xl font-bold text-cyan-600">RDP.SALE</span>
                            </div>

                            {/* Desktop Navigation */}
                            <nav className="hidden md:flex items-center space-x-6">
                                <button
                                    onClick={() => onNavigate('plans')}
                                    className="text-gray-700 hover:text-cyan-600 font-medium transition"
                                >
                                    Plans
                                </button>
                                {user && (
                                    <button
                                        onClick={() => onNavigate('dashboard')}
                                        className="text-gray-700 hover:text-cyan-600 font-medium transition"
                                    >
                                        Dashboard
                                    </button>
                                )}
                                <button
                                    onClick={() => onNavigate('cart')}
                                    className="relative text-gray-700 hover:text-cyan-600 transition"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                    {cartCount > 0 && (
                                        <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">
                                            {cartCount}
                                        </span>
                                    )}
                                </button>
                                {user ? (
                                    <div className="flex items-center space-x-4">
                                        <span className="text-gray-700 font-medium">{user.name}</span>
                                        <button
                                            onClick={onLogout}
                                            className="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium transition"
                                        >
                                            Logout
                                        </button>
                                    </div>
                                ) : (
                                    <button
                                        onClick={() => onNavigate('login')}
                                        className="bg-cyan-500 hover:bg-cyan-600 text-white px-6 py-2 rounded-lg font-medium transition"
                                    >
                                        Login
                                    </button>
                                )}
                            </nav>

                            {/* Mobile Menu Button */}
                            <button
                                className="md:hidden text-gray-700"
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>
                        </div>

                        {/* Mobile Menu */}
                        {mobileMenuOpen && (
                            <div className="md:hidden pb-4 space-y-2">
                                <button
                                    onClick={() => { onNavigate('plans'); setMobileMenuOpen(false); }}
                                    className="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
                                >
                                    Plans
                                </button>
                                {user && (
                                    <button
                                        onClick={() => { onNavigate('dashboard'); setMobileMenuOpen(false); }}
                                        className="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
                                    >
                                        Dashboard
                                    </button>
                                )}
                                <button
                                    onClick={() => { onNavigate('cart'); setMobileMenuOpen(false); }}
                                    className="block w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg"
                                >
                                    Cart {cartCount > 0 && `(${cartCount})`}
                                </button>
                                {user ? (
                                    <>
                                        <div className="px-4 py-2 text-gray-700 font-medium">{user.name}</div>
                                        <button
                                            onClick={() => { onLogout(); setMobileMenuOpen(false); }}
                                            className="block w-full text-left px-4 py-2 bg-red-500 text-white rounded-lg"
                                        >
                                            Logout
                                        </button>
                                    </>
                                ) : (
                                    <button
                                        onClick={() => { onNavigate('login'); setMobileMenuOpen(false); }}
                                        className="block w-full text-left px-4 py-2 bg-cyan-500 text-white rounded-lg"
                                    >
                                        Login
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </header>
            );
        };

        // Plan Card Component
        const PlanCard = ({ plan, onAddToCart }) => {
            return (
                <div className="relative bg-white rounded-xl shadow-lg p-6 card-hover">
                    {plan.popular && (
                        <div className="popular-badge">MOST POPULAR</div>
                    )}
                    <div className="text-center mb-4">
                        <h3 className="text-2xl font-bold text-gray-800 mb-2">{plan.name}</h3>
                        <div className="flex items-baseline justify-center">
                            <span className="text-4xl font-bold text-cyan-600">Rs {plan.price.toLocaleString()}</span>
                            <span className="text-gray-500 ml-2">/month</span>
                        </div>
                    </div>
                    <div className="space-y-3 mb-6">
                        <div className="flex items-center text-gray-700">
                            <svg className="w-5 h-5 text-green-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span>{plan.cpu}</span>
                        </div>
                        <div className="flex items-center text-gray-700">
                            <svg className="w-5 h-5 text-green-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span>{plan.ram}</span>
                        </div>
                        <div className="flex items-center text-gray-700">
                            <svg className="w-5 h-5 text-green-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span>{plan.storage}</span>
                        </div>
                        <div className="flex items-center text-gray-700">
                            <svg className="w-5 h-5 text-green-500 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span>{plan.traffic}</span>
                        </div>
                    </div>
                    <button
                        onClick={() => onAddToCart(plan)}
                        className={`w-full py-3 rounded-lg font-semibold transition ${
                            plan.popular
                                ? 'bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white'
                                : 'bg-cyan-500 hover:bg-cyan-600 text-white'
                        }`}
                    >
                        Order Now
                    </button>
                </div>
            );
        };

        // Plans Page Component
        const PlansPage = ({ onAddToCart, showToast }) => {
            const handleAddToCart = (plan) => {
                onAddToCart(plan);
                showToast(`${plan.name} plan added to cart!`, 'success');
            };

            return (
                <div className="gradient-bg min-h-screen py-12">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-12">
                            <h1 className="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
                                Choose Your Perfect RDP Plan
                            </h1>
                            <p className="text-xl text-gray-600">
                                Premium Remote Desktop Services with Unbeatable Performance
                            </p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {PLANS.map(plan => (
                                <PlanCard
                                    key={plan.id}
                                    plan={plan}
                                    onAddToCart={handleAddToCart}
                                />
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Cart Page Component
        const CartPage = ({ cart, onRemoveFromCart, onNavigate }) => {
            const subtotal = cart.reduce((sum, item) => sum + item.price, 0);

            if (cart.length === 0) {
                return (
                    <div className="gradient-bg min-h-screen py-12">
                        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="bg-white rounded-xl shadow-lg p-8 text-center">
                                <svg className="w-24 h-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                                <h2 className="text-2xl font-bold text-gray-800 mb-4">Your cart is empty</h2>
                                <p className="text-gray-600 mb-6">Add some RDP plans to get started!</p>
                                <button
                                    onClick={() => onNavigate('plans')}
                                    className="bg-cyan-500 hover:bg-cyan-600 text-white px-8 py-3 rounded-lg font-semibold transition"
                                >
                                    Continue Shopping
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="gradient-bg min-h-screen py-12">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-8">Shopping Cart</h1>

                        <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                            <div className="space-y-4">
                                {cart.map((item, index) => (
                                    <div key={index} className="flex items-center justify-between border-b pb-4 last:border-b-0 last:pb-0">
                                        <div className="flex-1">
                                            <h3 className="text-lg font-bold text-gray-800">{item.name} Plan</h3>
                                            <div className="text-sm text-gray-600 mt-1 space-y-1">
                                                <div>{item.cpu} • {item.ram}</div>
                                                <div>{item.storage}</div>
                                                <div>{item.traffic}</div>
                                            </div>
                                        </div>
                                        <div className="text-right ml-4">
                                            <div className="text-xl font-bold text-cyan-600 mb-2">
                                                Rs {item.price.toLocaleString()}
                                            </div>
                                            <button
                                                onClick={() => onRemoveFromCart(index)}
                                                className="text-red-500 hover:text-red-700 text-sm font-medium transition"
                                            >
                                                Remove
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="border-t pt-4 mt-4">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-gray-700">Subtotal:</span>
                                    <span className="text-xl font-semibold text-gray-800">Rs {subtotal.toLocaleString()}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-xl font-bold text-gray-800">Total:</span>
                                    <span className="text-2xl font-bold text-cyan-600">Rs {subtotal.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-4">
                            <button
                                onClick={() => onNavigate('plans')}
                                className="flex-1 bg-gray-500 hover:bg-gray-600 text-white py-3 rounded-lg font-semibold transition"
                            >
                                Continue Shopping
                            </button>
                            <button
                                onClick={() => onNavigate('checkout')}
                                className="flex-1 bg-cyan-500 hover:bg-cyan-600 text-white py-3 rounded-lg font-semibold transition"
                            >
                                Proceed to Checkout
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Login/Signup Modal Component
        const LoginModal = ({ onClose, onLogin, showToast }) => {
            const [isSignup, setIsSignup] = useState(false);
            const [loading, setLoading] = useState(false);
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                phone: '',
                address: '',
                password: ''
            });

            const handleChange = (field, value) => {
                setFormData({ ...formData, [field]: value });
            };

            const validateEmail = (email) => {
                return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            };

            const handleSubmit = async () => {
                // Validation
                if (isSignup) {
                    if (!formData.name || !formData.email || !formData.phone || !formData.address || !formData.password) {
                        showToast('Please fill in all fields', 'error');
                        return;
                    }
                    if (!validateEmail(formData.email)) {
                        showToast('Please enter a valid email address', 'error');
                        return;
                    }
                    if (formData.password.length < 6) {
                        showToast('Password must be at least 6 characters', 'error');
                        return;
                    }
                } else {
                    if (!formData.email || !formData.password) {
                        showToast('Please enter email and password', 'error');
                        return;
                    }
                    if (!validateEmail(formData.email)) {
                        showToast('Please enter a valid email address', 'error');
                        return;
                    }
                }

                setLoading(true);

                try {
                    const action = isSignup ? 'register' : 'login';
                    const response = await fetch(`${API_URL}?action=${action}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formData)
                    });

                    const data = await response.json();

                    if (data.success) {
                        showToast(isSignup ? 'Account created successfully!' : 'Login successful!', 'success');
                        onLogin(data.user);
                        onClose();
                    } else {
                        showToast(data.message || 'An error occurred', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                    console.error('Auth error:', error);
                }

                setLoading(false);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay">
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full max-h-[90vh] overflow-y-auto">
                        <div className="p-6">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-2xl font-bold text-gray-800">
                                    {isSignup ? 'Create Account' : 'Login'}
                                </h2>
                                <button
                                    onClick={onClose}
                                    className="text-gray-500 hover:text-gray-700"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    </svg>
                                </button>
                            </div>

                            <div className="space-y-4">
                                {isSignup && (
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">
                                            Full Name *
                                        </label>
                                        <input
                                            type="text"
                                            value={formData.name}
                                            onChange={(e) => handleChange('name', e.target.value)}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                            placeholder="Enter your name"
                                        />
                                    </div>
                                )}

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Email Address *
                                    </label>
                                    <input
                                        type="email"
                                        value={formData.email}
                                        onChange={(e) => handleChange('email', e.target.value)}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                        placeholder="Enter your email"
                                    />
                                </div>

                                {isSignup && (
                                    <>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Phone Number *
                                            </label>
                                            <input
                                                type="tel"
                                                value={formData.phone}
                                                onChange={(e) => handleChange('phone', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                                placeholder="Enter your phone"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Address *
                                            </label>
                                            <textarea
                                                value={formData.address}
                                                onChange={(e) => handleChange('address', e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                                placeholder="Enter your address"
                                                rows="2"
                                            />
                                        </div>
                                    </>
                                )}

                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">
                                        Password *
                                    </label>
                                    <input
                                        type="password"
                                        value={formData.password}
                                        onChange={(e) => handleChange('password', e.target.value)}
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                        placeholder="Enter your password"
                                    />
                                </div>
                            </div>

                            <button
                                onClick={handleSubmit}
                                disabled={loading}
                                className="w-full mt-6 bg-cyan-500 hover:bg-cyan-600 text-white py-3 rounded-lg font-semibold transition disabled:opacity-50"
                            >
                                {loading ? 'Please wait...' : (isSignup ? 'Create Account' : 'Login')}
                            </button>

                            <div className="mt-4 text-center">
                                <button
                                    onClick={() => setIsSignup(!isSignup)}
                                    className="text-cyan-600 hover:text-cyan-700 font-medium"
                                >
                                    {isSignup ? 'Already have an account? Login' : "Don't have an account? Sign up"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Checkout Page Component
        const CheckoutPage = ({ cart, user, onNavigate, showToast, onClearCart }) => {
            const [loading, setLoading] = useState(false);
            const [transactionId, setTransactionId] = useState('');
            const [screenshot, setScreenshot] = useState(null);
            const [screenshotPreview, setScreenshotPreview] = useState('');

            const total = cart.reduce((sum, item) => sum + item.price, 0);

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        showToast('File size must be less than 5MB', 'error');
                        return;
                    }

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setScreenshot(reader.result);
                        setScreenshotPreview(URL.createObjectURL(file));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async () => {
                if (!transactionId || !screenshot) {
                    showToast('Please upload payment screenshot and enter transaction ID', 'error');
                    return;
                }

                if (transactionId.length < 5) {
                    showToast('Please enter a valid transaction ID', 'error');
                    return;
                }

                setLoading(true);

                try {
                    // Create orders for each item in cart
                    const orderPromises = cart.map(plan =>
                        fetch(`${API_URL}?action=createOrder`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                userEmail: user.email,
                                planName: plan.name,
                                price: plan.price,
                                paymentScreenshot: screenshot,
                                transactionId: transactionId
                            })
                        })
                    );

                    const responses = await Promise.all(orderPromises);
                    const results = await Promise.all(responses.map(r => r.json()));

                    const allSuccess = results.every(r => r.success);

                    if (allSuccess) {
                        showToast('Order placed successfully! Please wait for confirmation.', 'success');
                        onClearCart();
                        setTimeout(() => {
                            onNavigate('dashboard');
                        }, 2000);
                    } else {
                        showToast('Some orders failed. Please contact support.', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                    console.error('Order error:', error);
                }

                setLoading(false);
            };

            return (
                <div className="gradient-bg min-h-screen py-12">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-8">Checkout</h1>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            {/* Order Summary */}
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Order Summary</h2>
                                <div className="space-y-3 mb-4">
                                    {cart.map((item, index) => (
                                        <div key={index} className="flex justify-between text-gray-700 border-b pb-2">
                                            <span>{item.name} Plan</span>
                                            <span className="font-semibold">Rs {item.price.toLocaleString()}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="border-t pt-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xl font-bold text-gray-800">Total:</span>
                                        <span className="text-2xl font-bold text-cyan-600">Rs {total.toLocaleString()}</span>
                                    </div>
                                </div>
                            </div>

                            {/* Payment Details */}
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <h2 className="text-xl font-bold text-gray-800 mb-4">Payment Details</h2>
                                <div className="bg-cyan-50 border-2 border-cyan-200 rounded-lg p-4 mb-6">
                                    <h3 className="font-bold text-gray-800 mb-2">Easypaisa Payment</h3>
                                    <div className="space-y-1 text-sm text-gray-700">
                                        <div className="flex justify-between">
                                            <span>Account Number:</span>
                                            <span className="font-bold">{PAYMENT_INFO.accountNumber}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span>Account Name:</span>
                                            <span className="font-bold">{PAYMENT_INFO.accountHolder}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Upload Payment Screenshot *
                                        </label>
                                        <input
                                            type="file"
                                            accept="image/*"
                                            onChange={handleFileChange}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                        />
                                        {screenshotPreview && (
                                            <img
                                                src={screenshotPreview}
                                                alt="Preview"
                                                className="mt-2 w-full h-32 object-cover rounded-lg"
                                            />
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            Transaction ID *
                                        </label>
                                        <input
                                            type="text"
                                            value={transactionId}
                                            onChange={(e) => setTransactionId(e.target.value)}
                                            className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-transparent"
                                            placeholder="Enter transaction ID"
                                        />
                                    </div>
                                </div>

                                <button
                                    onClick={handleSubmit}
                                    disabled={loading}
                                    className="w-full mt-6 bg-cyan-500 hover:bg-cyan-600 text-white py-3 rounded-lg font-semibold transition disabled:opacity-50"
                                >
                                    {loading ? 'Processing...' : 'Submit Payment'}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Dashboard Page Component
        const DashboardPage = ({ user, showToast }) => {
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(true);
            const [actionLoading, setActionLoading] = useState({});

            useEffect(() => {
                loadOrders();
            }, []);

            const loadOrders = async () => {
                try {
                    const response = await fetch(`${API_URL}?action=getOrders&email=${user.email}`);
                    const data = await response.json();

                    if (data.success) {
                        setOrders(data.orders);
                    }
                } catch (error) {
                    console.error('Load orders error:', error);
                }
                setLoading(false);
            };

            const handleServerAction = async (orderId, action) => {
                const confirmMsg = `Are you sure you want to ${action.toLowerCase()} this server?`;
                if (!confirm(confirmMsg)) return;

                setActionLoading({ ...actionLoading, [orderId]: action });

                try {
                    const response = await fetch(`${API_URL}?action=serverAction`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            orderId: orderId,
                            userEmail: user.email,
                            action: action
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showToast(`${action} request submitted. Processing time: ~9 minutes`, 'success');
                    } else {
                        showToast('Request failed. Please try again.', 'error');
                    }
                } catch (error) {
                    showToast('Network error. Please try again.', 'error');
                    console.error('Server action error:', error);
                }

                setActionLoading({ ...actionLoading, [orderId]: null });
            };

            const getStatusBadge = (status) => {
                const statusConfig = {
                    pending: { bg: 'bg-yellow-100', text: 'text-yellow-800', label: 'Payment Pending' },
                    processing: { bg: 'bg-blue-100', text: 'text-blue-800', label: 'Installing (~30 mins)' },
                    active: { bg: 'bg-green-100', text: 'text-green-800', label: 'Active' },
                    suspended: { bg: 'bg-red-100', text: 'text-red-800', label: 'Suspended' }
                };

                const config = statusConfig[status] || statusConfig.pending;

                return (
                    <span className={`${config.bg} ${config.text} px-3 py-1 rounded-full text-sm font-semibold`}>
                        {config.label}
                    </span>
                );
            };

            if (loading) {
                return (
                    <div className="gradient-bg min-h-screen py-12">
                        <LoadingSpinner />
                    </div>
                );
            }

            return (
                <div className="gradient-bg min-h-screen py-12">
                    <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="mb-8">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">My Dashboard</h1>
                            <p className="text-gray-600">Welcome back, {user.name}!</p>
                        </div>

                        {orders.length === 0 ? (
                            <div className="bg-white rounded-xl shadow-lg p-8 text-center">
                                <svg className="w-24 h-24 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <h2 className="text-2xl font-bold text-gray-800 mb-4">No Orders Yet</h2>
                                <p className="text-gray-600">You haven't placed any orders yet.</p>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                {orders.map((order, index) => (
                                    <div key={index} className="bg-white rounded-xl shadow-lg p-6">
                                        <div className="flex flex-col md:flex-row md:items-center md:justify-between mb-4">
                                            <div>
                                                <h3 className="text-xl font-bold text-gray-800">{order.planName} Plan</h3>
                                                <p className="text-gray-600 text-sm">Order ID: {order.orderId}</p>
                                                <p className="text-gray-600 text-sm">Order Date: {new Date(order.orderDate).toLocaleDateString()}</p>
                                            </div>
                                            <div className="mt-4 md:mt-0">
                                                {getStatusBadge(order.status)}
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center border-t pt-4">
                                            <span className="text-lg font-semibold text-gray-700">Price:</span>
                                            <span className="text-xl font-bold text-cyan-600">Rs {order.price.toLocaleString()}</span>
                                        </div>

                                        {order.status === 'active' && order.serverIp && (
                                            <div className="mt-6 bg-gray-50 rounded-lg p-4">
                                                <h4 className="font-bold text-gray-800 mb-3">Server Details</h4>
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                                    <div>
                                                        <span className="text-sm text-gray-600">IP Address:</span>
                                                        <p className="font-mono font-semibold text-gray-800">{order.serverIp}</p>
                                                    </div>
                                                    <div>
                                                        <span className="text-sm text-gray-600">Username:</span>
                                                        <p className="font-mono font-semibold text-gray-800">{order.serverUsername}</p>
                                                    </div>
                                                    <div>
                                                        <span className="text-sm text-gray-600">Password:</span>
                                                        <p className="font-mono font-semibold text-gray-800">{order.serverPassword}</p>
                                                    </div>
                                                </div>

                                                <div className="flex flex-wrap gap-3">
                                                    <button
                                                        onClick={() => handleServerAction(order.orderId, 'Start')}
                                                        disabled={actionLoading[order.orderId] || order.serverStatus === 'active'}
                                                        className="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-semibold transition disabled:opacity-50"
                                                    >
                                                        {actionLoading[order.orderId] === 'Start' ? 'Starting...' : 'Start'}
                                                    </button>
                                                    <button
                                                        onClick={() => handleServerAction(order.orderId, 'Restart')}
                                                        disabled={actionLoading[order.orderId]}
                                                        className="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold transition disabled:opacity-50"
                                                    >
                                                        {actionLoading[order.orderId] === 'Restart' ? 'Restarting...' : 'Restart'}
                                                    </button>
                                                    <button
                                                        onClick={() => handleServerAction(order.orderId, 'Stop')}
                                                        disabled={actionLoading[order.orderId] || order.serverStatus === 'suspended'}
                                                        className="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-semibold transition disabled:opacity-50"
                                                    >
                                                        {actionLoading[order.orderId] === 'Stop' ? 'Stopping...' : 'Stop'}
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [currentPage, setCurrentPage] = useState('plans');
            const [user, setUser] = useState(null);
            const [cart, setCart] = useState([]);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                // Load user from localStorage
                const savedUser = localStorage.getItem('rdp_user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }

                // Load cart from localStorage
                const savedCart = localStorage.getItem('rdp_cart');
                if (savedCart) {
                    setCart(JSON.parse(savedCart));
                }
            }, []);

            useEffect(() => {
                // Save cart to localStorage
                localStorage.setItem('rdp_cart', JSON.stringify(cart));
            }, [cart]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
            };

            const handleLogin = (userData) => {
                setUser(userData);
                localStorage.setItem('rdp_user', JSON.stringify(userData));
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('rdp_user');
                setCurrentPage('plans');
                showToast('Logged out successfully', 'success');
            };

            const handleAddToCart = (plan) => {
                setCart([...cart, plan]);
            };

            const handleRemoveFromCart = (index) => {
                const newCart = cart.filter((_, i) => i !== index);
                setCart(newCart);
                showToast('Item removed from cart', 'success');
            };

            const handleClearCart = () => {
                setCart([]);
            };

            const handleNavigate = (page) => {
                if (page === 'checkout' && cart.length === 0) {
                    showToast('Your cart is empty', 'error');
                    return;
                }

                if ((page === 'checkout' || page === 'dashboard') && !user) {
                    setCurrentPage('login');
                    showToast('Please login to continue', 'info');
                    return;
                }

                setCurrentPage(page);
            };

            return (
                <>
                    <Header
                        user={user}
                        cartCount={cart.length}
                        onNavigate={handleNavigate}
                        onLogout={handleLogout}
                    />

                    {currentPage === 'plans' && (
                        <PlansPage
                            onAddToCart={handleAddToCart}
                            showToast={showToast}
                        />
                    )}

                    {currentPage === 'cart' && (
                        <CartPage
                            cart={cart}
                            onRemoveFromCart={handleRemoveFromCart}
                            onNavigate={handleNavigate}
                        />
                    )}

                    {currentPage === 'checkout' && (
                        <CheckoutPage
                            cart={cart}
                            user={user}
                            onNavigate={handleNavigate}
                            showToast={showToast}
                            onClearCart={handleClearCart}
                        />
                    )}

                    {currentPage === 'dashboard' && (
                        <DashboardPage
                            user={user}
                            showToast={showToast}
                        />
                    )}

                    {currentPage === 'login' && (
                        <LoginModal
                            onClose={() => setCurrentPage('plans')}
                            onLogin={handleLogin}
                            showToast={showToast}
                        />
                    )}

                    {toast && (
                        <Toast
                            message={toast.message}
                            type={toast.type}
                            onClose={() => setToast(null)}
                        />
                    )}
                </>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
