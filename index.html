<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop the best products with Cash on Delivery. Browse our collection and order now!">
  <title>Shop - E-Commerce Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">ShopNow</a>

      <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li>
          <a href="cart.html" class="nav-link" style="position: relative;">
            Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </li>
        <li id="login-link"><a href="login.html" class="nav-link">Login</a></li>
        <li id="dashboard-link" style="display: none;"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li id="logout-link" style="display: none;"><a href="#" class="nav-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Our Products</h1>
      <p class="page-subtitle">Browse our collection and order with Cash on Delivery</p>
    </div>

    <!-- Products Grid -->
    <div id="products-container" class="products-grid">
      <!-- Products will be loaded here dynamically -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
  <script>
    // Load products when page loads
    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
    });
  </script>
</body>
</html>
