<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your account">
  <title>Login - E-Commerce Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">ShopNow</a>

      <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>

      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li>
          <a href="cart.html" class="nav-link" style="position: relative;">
            Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </li>
        <li id="login-link"><a href="login.html" class="nav-link">Login</a></li>
        <li id="dashboard-link" style="display: none;"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li id="logout-link" style="display: none;"><a href="#" class="nav-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="auth-container">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Login to your account</p>
      </div>

      <div id="error-message"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            required
            placeholder="Enter your email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            required
            placeholder="Enter your password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Login
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="signup.html" class="auth-link">Create Account</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
